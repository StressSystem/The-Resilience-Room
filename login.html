<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login or Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>Join the Resilience Room</h1>
            <p id="form-title">Login to your account.</p>
        </header>

        <section class="info-card">
            <!-- Login Form -->
            <form id="login-form" action="/login" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <!-- This button requires backend code to work -->
                <button type="submit" class="btn">Login</button>
            </form>

            <!-- Signup Form (Hidden initially) -->
            <form id="signup-form" action="/signup" method="POST" style="display: none;">
                <div class="form-group">
                    <label for="new-email">Email Address</label>
                    <input type="email" id="new-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Create Password</label>
                    <input type="password" id="new-password" name="password" required>
                </div>
                <!-- This button requires backend code to work -->
                <button type="submit" class="btn">Sign Up</button>
            </form>

            <div class="form-actions">
                <a href="#" id="toggle-form">Don't have an account? Sign Up</a>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Miles Pirodon</p>
        </footer>
    </div>

    <!-- JavaScript to toggle between Login and Signup forms -->
    <script>
        const toggleLink = document.getElementById('toggle-form');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const formTitle = document.getElementById('form-title');

        toggleLink.addEventListener('click', function(event) {
            event.preventDefault();
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                formTitle.textContent = 'Login to your account.';
                toggleLink.textContent = "Don't have an account? Sign Up";
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                formTitle.textContent = 'Create a new account.';
                toggleLink.textContent = "Already have an account? Login";
            }
        });
    </script>
</body>
</html>
