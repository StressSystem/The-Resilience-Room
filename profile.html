<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Profile - The Resilience Room</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="profile">
  <div class="glass-container">

    <nav>
      <ul>
        <li><a class="nav-link" href="index.html">Home</a></li>
        <li><a class="nav-link" href="quiz.html">Quiz</a></li>
        <li class="dropdown">
          <a class="nav-link dropbtn" href="javascript:void(0)">Info</a>
          <div class="dropdown-content">
            <a href="mental_health.html">Mental Health</a>
            <a href="services.html">Our Services</a>
          </div>
        </li>
        <li id="auth-nav-slot"><a class="nav-link" href="login.html">Login</a></li>
      </ul>
    </nav>

    <header>
      <h1>Your Profile</h1>
      <p class="muted">Your account details.</p>
    </header>

    <section class="info-card">

      <div class="panel" id="profile-panel" hidden>
        <h2>Logged in ✅</h2>

        <p><strong>Email:</strong> <span id="profile-email"></span></p>
        <p><strong>User ID:</strong> <span id="profile-id"></span></p>

        <div class="panel" style="margin-top: 14px;">
          <h3>Display name</h3>
          <p class="muted">This saves to your account.</p>

          <div class="form-group" style="margin-top: 10px;">
            <label for="display-name">Display name</label>
            <input id="display-name" type="text" placeholder="e.g. Miles" />
            <p class="hint" id="display-save-msg"></p>
          </div>

          <div class="cta-row" style="justify-content: flex-start;">
            <button class="btn btn-small" id="save-display-btn" type="button">Save</button>
            <button class="btn btn-small btn-outline" id="clear-display-btn" type="button">Clear</button>
          </div>
        </div>

        <div class="cta-row">
          <a href="quiz.html" class="btn btn-small">Take the Quiz</a>
          <button class="btn btn-outline btn-small" id="logout-btn" type="button">Logout</button>
        </div>
      </div>

      <div class="panel" id="profile-logged-out" hidden>
        <h2>You’re not logged in</h2>
        <p class="muted">Log in to view your profile.</p>
        <a class="btn" href="login.html">Go to Login</a>
      </div>

    </section>

    <footer>
      <p>&copy; 2026 Miles Pirodon</p>
    </footer>
  </div>

  <!-- Supabase + App -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
  <script defer src="supabaseClient.js?v=100"></script>
  <script defer src="app.js?v=100"></script>

</body>
</html>
