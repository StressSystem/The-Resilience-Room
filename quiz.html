  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="quiz">
  <div class="glass-container">

    <nav>
      <ul>
        <li><a class="nav-link" href="index.html">Home</a></li>
        <li><a class="nav-link" href="quiz.html">Quiz</a></li>
        <li class="dropdown">
          <a class="nav-link dropbtn" href="javascript:void(0)">Info</a>
          <div class="dropdown-content">
            <a href="mental_health.html">Mental Health</a>
            <a href="services.html">Our Services</a>
          </div>
        </li>
        <li id="auth-nav-slot"><a class="nav-link" href="login.html">Login</a></li>
      </ul>
    </nav>

    <header>
      <h1>Personal Resilience Check</h1>
      <p class="muted">This takes about 2 minutes.</p>
    </header>

    <section class="info-card">

      <div id="quiz-area">
        <p class="muted" id="quiz-progress">Question 1 of 8</p>
        <h2 id="quiz-question">Loading...</h2>

        <div class="quiz-options" id="quiz-options"></div>

        <div class="quiz-controls">
          <button class="btn btn-outline btn-small" id="quiz-back" type="button">Back</button>
          <button class="btn btn-small" id="quiz-restart" type="button">Restart</button>
        </div>
      </div>

      <div id="quiz-results" hidden>
        <h2 id="result-title">Your Result</h2>
        <p id="result-summary" class="muted"></p>

        <div class="result-card" id="result-card"></div>

        <div class="next-step">
          <h3>Your Next Step</h3>
          <p>Pick one small thing — that’s progress.</p>
          <div class="next-step-actions">
            <a href="index.html" class="btn btn-small">Breathing Tool</a>
            <a href="mental_health.html" class="btn btn-small btn-outline">Right Now Help</a>
            <a href="profile.html" class="btn btn-small btn-outline">Profile</a>
          </div>
        </div>
      </div>

    </section>

    <footer>
      <p>&copy; 2026 Miles Pirodon</p>
    </footer>
  </div>
